<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f8f1f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skincare Routine">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>שגרת טיפוח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f1f6;--card:#fff;--ink:#3b3340;--mu:#6f6778;--ln:#f0e4ee;--pk:#d93a86;--lil:#f3d9fb;--gr:radial-gradient(circle at 12% 92%,#ff9a7a 0,transparent 55%),radial-gradient(circle at 92% 12%,#d18cf0 0,transparent 60%),linear-gradient(135deg,#f6469a,#e66fc4);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1822;--card:#2a2331;--ink:#f3eaf5;--mu:#9d93a6;--ln:#3b3243;--pk:#f46aa8;--lil:#4a3358;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1822;--card:#2a2331;--ink:#f3eaf5;--mu:#9d93a6;--ln:#3b3243;--pk:#f46aa8;--lil:#4a3358;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.5 Heebo,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--pk);outline-offset:2px}
h3{font-size:18px;font-weight:400;margin:0}
.app{max-width:460px;margin:0 auto;padding:22px 18px 48px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;border:1px solid var(--pk);color:var(--pk);border-radius:99px;padding:9px 0;font-size:14px}
.tabs .pb{flex:none;width:44px;padding:0;border:0;background:var(--gr)}
summary{color:var(--pk);font-size:14px;cursor:pointer;margin:2px 0 10px}
textarea{width:100%;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;margin:8px 0}
.lg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--mu)}
.sws{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mu);width:56px}
.sw i{width:40px;height:40px;border-radius:50%;display:block;border:2px solid transparent}
.sw.on i{border-color:var(--ink)}
#tt{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:40;pointer-events:none}
#tt div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 18px;font-size:14px;display:flex;gap:14px;align-items:center}
#tt button{color:var(--lil);font-weight:500}
.pn{max-height:90vh;overflow:auto}
.chs.seg{flex-wrap:nowrap;overflow-x:auto;margin-bottom:14px}
.seg .ch{flex:none;padding:8px 16px;font-size:14px}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--mu);margin-bottom:4px}
.pb{width:34px;height:34px;border-radius:50%;background:var(--gr);flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--ln);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:6px}
.tabs button{border:0;color:var(--mu);border-radius:14px;padding:11px 0;font-size:13px}
.tabs button.on{background:var(--lil);color:var(--pk)}
.app{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#tt{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cs{border:2px solid var(--ln);border-radius:14px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;color:var(--mu);font-size:13px}
.cs.on{border-color:var(--pk)}
.cs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cs small{position:absolute;bottom:6px;background:var(--card);color:var(--ink);padding:1px 8px;border-radius:99px;font-size:11px}
.tabs button.on{background:var(--lil);border-color:var(--lil)}
.wnav{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.ar{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--card)}
.ti{font-size:24px;font-weight:200}
.ad{color:var(--pk);font-size:14px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.sd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;border-radius:99px}
.sd small{font-size:11px;color:var(--mu)}
.sd b{font-weight:300;font-size:19px}
.sd.td b{color:var(--pk)}
.sd.on{background:var(--pk);color:#fff;font-weight:500}
.sd.on small,.sd.on b{color:#fff}
.dots{display:flex;gap:4px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;border:1px solid transparent}
.dots i.part{border-color:var(--pk)}
.dots i.full{background:var(--pk);border-color:var(--pk)}
.on .dots i.part{border-color:#fff}
.on .dots i.full{background:#fff;border-color:#fff}
.hero{margin-top:14px;border-radius:26px;padding:16px 20px;color:#fff;background:var(--gr);min-height:100px;display:flex;flex-direction:column;justify-content:space-between}
.hero small{font-size:13px}
.big{font-size:32px;font-weight:300;line-height:1.15}
.hp{font-size:13px}
.card{background:var(--card);border-radius:24px;padding:20px;margin-top:14px}
.card section+section{margin-top:24px}
.em{color:var(--mu);font-size:14px;margin:8px 0 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mu);flex:none;position:relative}
.chk::before{content:"";position:absolute;inset:-9px}
.chk.on{background:var(--pk);border-color:var(--pk)}
.chk.on::after{content:"";position:absolute;left:8px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.nm{flex:1}
.nm.done{color:var(--mu);text-decoration:line-through}
.tag{font-size:12px;color:var(--ink);background:var(--lil);padding:2px 10px;border-radius:99px;white-space:nowrap}
.rm{color:var(--mu);font-size:22px;width:44px;height:44px}
.add{display:block;width:100%;margin-top:12px;padding:12px;border:1px dashed var(--pk);border-radius:14px;text-align:center;color:var(--pk);font-size:14px}
.ghost{border:1px solid var(--ln);border-radius:99px;padding:7px 16px;font-size:14px;margin-bottom:18px}
.pk{margin-top:12px;padding:14px;background:var(--bg);border-radius:18px}
.pr{display:flex;width:100%;align-items:center;gap:10px;padding:10px 0;text-align:start;border-bottom:1px solid var(--ln)}
.pr span:first-child{flex:1}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.ch{border:1px solid var(--pk);color:var(--pk);border-radius:99px;padding:4px 13px;font-size:13px}
.ch.on{background:var(--lil);border-color:var(--lil)}
.fm{margin-top:12px}
input[type=text],input[type=date],input[type=number]{width:100%;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;margin-bottom:10px}
.btns{display:flex;gap:18px;align-items:center;margin-top:4px}
.pri{background:var(--pk);color:#fff;border-radius:99px;padding:9px 24px;font-size:14px}
.cn{color:var(--mu);font-size:14px}
.dl{color:var(--pk);font-size:14px}
.pc{display:flex;width:100%;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:14px 16px;margin-top:10px;text-align:start}
.pc span:first-child{flex:1}
.pc em{font-style:normal;color:var(--mu);font-size:12px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.wk span{text-align:center;font-size:11px;color:var(--mu);padding-bottom:8px}
.md{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.md b{font-weight:300;font-size:16px;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%}
.md.td b{background:var(--lil);color:var(--pk)}
.ph-h{display:flex;justify-content:space-between;align-items:center}
.pa{color:var(--pk);font-size:14px;cursor:pointer}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.ovl{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.sc{position:absolute;inset:0;background:rgba(30,20,35,.6)}
.pn{position:relative;background:var(--card);border-radius:24px;padding:14px;width:100%;max-width:420px}
.pn img{width:100%;max-height:62vh;object-fit:contain;border-radius:14px;display:block}
.pn .btns{justify-content:space-between;margin:14px 6px 2px}
.br{display:block;font-size:12px;color:var(--mu)}
.gh{font-size:13px;color:var(--mu);margin:22px 4px 0}
.srt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--mu)}
.srt .ad{margin-inline-start:auto}
.dt label{display:block;font-size:12px;color:var(--mu)}
.prw{display:flex;align-items:center;border-bottom:1px solid var(--ln)}
.prw .pr{flex:1;border:0}
.rp{color:var(--pk);font-size:17px;width:38px;height:38px}
.rc{color:var(--mu);font-size:13px}
.rq{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:13px;color:var(--mu);flex-wrap:wrap}
.rq .pri{padding:6px 14px;font-size:13px}
.tm{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln)}
.tm input{margin:0;flex:1;padding:7px 12px;font-size:15px}
input[type=date],input[type=number]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;height:48px;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:start;min-height:1.2em}
.dt,.dt label{min-width:0}
.nm,.nb{min-width:0;overflow-wrap:anywhere}
.tag{max-width:45%;overflow:hidden;text-overflow:ellipsis}
.ch.sg{border-style:dashed}
.fact #fb,.fact .tagrow,.fact #ft,.fact details{display:none}
</style>
</head>
<body>
<main class="app">
  <div class="tabs"><button data-tab="week">שבוע</button><button data-tab="month">חודש</button><button data-tab="lib">מוצרים</button><button data-tab="shop">קניות</button></div>
  <div class="hd"><span>שגרת טיפוח</span><button class="pb" data-act="pl" aria-label="צבעים"></button></div><div id="pl"></div><div id="view"></div>
</main>
<div id="ov"></div><div id="tt"></div>
<script>
const K='skincare-routine-v1',KP='skincare-photos-v1';
let S={products:[],days:{}},P={};
try{S=JSON.parse(localStorage.getItem(K))||S}catch(e){}
try{P=JSON.parse(localStorage.getItem(KP))||P}catch(e){}
S.products=S.products||[];S.days=S.days||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const saveP=()=>{try{localStorage.setItem(KP,JSON.stringify(P));return true}catch(e){return false}};
let MN=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
let DN=['יום ראשון','יום שני','יום שלישי','יום רביעי','יום חמישי','יום שישי','שבת'];
let WK=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const TAGS=['ניקוי','טונר','סרום','קרם עיניים','קרם לחות','קרם הגנה','טיפול נקודתי','מסכה','שמפו','מרכך','מסכת שיער','שמן שיער','קרם גוף','פילינג גוף','סבון גוף'];
S.tags=S.tags||[...TAGS];
S.areas=S.areas||['פנים','גוף','שיער'];
if(!S.tv){S.tags=[...new Set([...S.tags,...TAGS])];S.tv=1}
S.tags=S.tags.map(x=>x==='פילופ גוף'?'פילינג גוף':x);S.products.forEach(p=>{if(p.tag==='פילופ גוף')p.tag='פילינג גוף'});
S.rules=S.rules||[];S.shop=S.shop||[];
S.products.forEach(p=>{p.area=p.area??'פנים'});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const wkStart=k=>addDays(k,-parse(k).getDay());
const prod=id=>S.products.find(p=>p.id===id);
const hits=(r,k)=>{if(k<r.from||(r.to&&k>r.to))return false;const d=parse(k);return r.type==='d'||(r.type==='w'&&r.days.includes(d.getDay()))||(r.type==='n'&&mDiff(k,r.a)%r.n===0)||(r.type==='m'&&d.getDate()===parse(r.a).getDate())};
const dayOf=k=>{const d=S.days[k]||{},o={};['am','pm','tx'].forEach(s=>{const m=(d[s]||[]).map((x,mi)=>({...x,mi})),g=[];S.rules.forEach(r=>{if(r.slots.includes(s)&&hits(r,k)&&!r.skip.includes(k+'|'+s)&&!m.some(x=>x.p===r.p)&&!g.some(x=>x.p===r.p)){const q=prod(r.p);if(q&&!(q.fin&&k>=q.fin))g.push({p:r.p,d:!!(d.cd&&d.cd[s+':'+r.p]),r:r.id})}});o[s]=[...m,...g]});return o};
const stop=(r,n,k)=>{const rest=r.slots.filter(s=>s!==n),t0=r.to;if(rest.length)S.rules.push({...r,id:'r'+Date.now().toString(36),slots:rest,from:k,to:t0,skip:[]});r.to=addDays(k,-1);if(r.to<r.from)S.rules=S.rules.filter(z=>z!==r)};
const ensure=k=>{const d=S.days[k]||(S.days[k]={am:[],pm:[]});d.tx=d.tx||[];d.cd=d.cd||{};return d};
const st=a=>!a.length?'':a.every(x=>x.d)?'full':'part';
const tg=p=>p.tag?`<span class="tag">${esc(p.tag)}</span>`:'';
const usedTags=()=>[...new Set(S.products.map(p=>p.tag).filter(Boolean))];
const tagList=()=>[...new Set([...S.tags,...usedTags()])];
const nm=p=>esc(p.name)+(p.brand?`<span class="br">${esc(p.brand)}</span>`:'');
const mDiff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const dc=p=>{if(!p.start)return '';const n=mDiff(U.sel,p.start)+1;return n>=1&&n<=30?`<span class="tag">יום ${n}</span>`:''};
const pa=p=>{if(!p.open||!p.pao)return '';const e=parse(p.open);e.setMonth(e.getMonth()+p.pao);const l=Math.ceil((e-parse(key(new Date())))/864e5);return `<span class="br">${l<0?'פג תוקף':l<=30?`נשארו ${l} ימים`:`נשארו ${Math.round(l/30)} חודשים`}</span>`};
const ex=()=>({area:U.dr.area||S.areas[0]||'',start:U.dr.start||'',open:U.dr.open||'',pao:+U.dr.pao||0,act:U.dr.act?1:0});
const fx=()=>{if(U.edit==='new')return '';const p=prod(U.edit);return p&&p.fin?'<div class="btns"><button class="cn" data-act="unfin">החזרה מהארכיון</button></div>':'<div class="btns"><button class="cn" data-act="fin" data-t="1">סיימתי, אקנה שוב</button><button class="cn" data-act="fin" data-t="0">סיימתי, לא אקנה שוב</button></div>'};
const afc=()=>`<div class="chs seg">${[...S.areas,''].map(a=>`<button class="ch${U.af===a?' on':''}" data-act="afa" data-t="${esc(a)}">${a?esc(a):'הכל'}</button>`).join('')}<button class="ch" data-act="aa2">+</button></div>${U.ai?'<div class="fm"><input type="text" id="an2" placeholder="קטגוריה חדשה" autocomplete="off"><button class="pri" data-act="as2">הוספה</button></div>':''}`;
const dots=D=>`<span class="dots"><i class="${st(D.am)}"></i><i class="${st(D.pm)}"></i></span>`;
let U={tab:'week',sel:key(new Date()),mon:null,adding:null,edit:null,tgt:null,dr:{name:'',brand:'',tag:''},flt:'',arm:null,msg:'',ph:null,sort:'name',tm:false,rt:null,rv:'',la:'',af:S.areas[0]||'',ai:false,rq:null,rf:null,pp:null,pl:false,un:null,ar:false,cmp:null};

function chips(){
  const t=usedTags();if(!t.length)return '';
  return `<div class="chs">${['',...t].map(x=>`<button class="ch${U.flt===x?' on':''}" data-act="flt" data-t="${esc(x)}">${x?esc(x):'הכל'}</button>`).join('')}</div>`;
}
function form(){
  return `<div class="fm${U.dr.act?' fact':''}"><input type="text" id="fn" placeholder="${U.dr.act?'שם הפעולה':'שם המוצר'}" autocomplete="off" value="${esc(U.dr.name)}"><input type="text" id="fb" placeholder="חברה" autocomplete="off" value="${esc(U.dr.brand)}"><div class="chs">${S.areas.map(a=>`<button class="ch${U.dr.area===a?' on':''}" data-act="sar" data-t="${a}">${a}</button>`).join('')}</div><div class="chs tagrow">${tagList().map(t=>`<button class="ch${U.dr.tag===t?' on':''}" data-act="stag" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div><input type="text" id="ft" placeholder="או תגית משלך" autocomplete="off" value="${esc(U.dr.tag)}"><details${U.dr.start||U.dr.open||U.dr.pao?' open':''}><summary>פרטים נוספים</summary><div class="dt"><label>תאריך התחלה<input type="date" id="fs" value="${U.dr.start||''}"></label><label>תאריך פתיחה<input type="date" id="fo" value="${U.dr.open||''}"></label><label>תוקף אחרי פתיחה (חודשים)<input type="number" id="fp" min="1" max="60" value="${U.dr.pao||''}"></label></div></details><div class="btns"><button class="pri" data-act="sv">שמירה</button><button class="cn" data-act="fc">ביטול</button>${U.edit!=='new'?`<button class="dl" data-act="dp">${U.arm===U.edit?'למחוק מכל הימים?':'מחיקה'}</button>`:''}</div>${fx()}</div>`;
}
function rform(){
  const f=U.rf,p=prod(f.id),ch=(on,act,t,l)=>`<button class="ch${on?' on':''}" data-act="${act}" data-t="${t}">${l}</button>`;
  return `<div class="fm"><h3>${esc(p.name)}</h3><div class="lbl"><span>באיזה חלק ביום</span></div><div class="chs">${[['am','בוקר'],['pm','ערב']].map(([s,l])=>ch(f.slots.includes(s),'rs2',s,l)).join('')}</div><div class="lbl"><span>חזרה, מהיום הנבחר</span></div><div class="chs">${[['d','כל יום'],['w','ימים בשבוע'],['n','כל כמה ימים'],['m','כל חודש']].map(([t,l])=>ch(f.type===t,'rt',t,l)).join('')}</div>${f.type==='w'?`<div class="chs">${WK.map((w,i)=>ch(f.days.includes(i),'rd',i,w)).join('')}</div>`:''}${f.type==='n'?`<div class="dt"><label>כל כמה ימים<input type="number" id="rk" min="2" max="60" value="${f.k}"></label></div>`:''}<div class="dt"><label>תאריך סיום (לא חובה)<input type="date" id="re" value="${f.to||''}"></label></div><div class="btns"><button class="pri" data-act="rsv">הוספה</button><button class="cn" data-act="rcx">ביטול</button></div></div>`;
}
